# Build the MNN Android LLM Chat app (APK) in GitHub Actions.
#
# Pipeline:
#   1. ubuntu-24.04 runner (Android SDK base preinstalled; no setup-android action).
#   2. JDK 17 (Temurin) + manual SDK component install (NDK 27.2.12479018, CMake 3.22.1).
#   3. Debug keystore "blindage" to avoid Gradle signing/permission failures.
#   4. Native MNN engine build (project/android/build_64 + make install -> libMNN.so).
#   5. Gradle assembleStandardDebug with GRADLE_OPTS=-Xmx4g.
#   6. Upload the resulting APK as an artifact.

name: android-app-build

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'apps/Android/**'
      - 'source/**'
      - 'express/**'
      - 'include/**'
      - 'transformers/**'
      - 'tools/cv/**'
      - 'tools/audio/**'
      - 'schema/**'
      - 'CMakeLists.txt'
      - 'project/android/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/Android/**'
      - 'source/**'
      - 'express/**'
      - 'include/**'
      - 'transformers/**'
      - 'tools/cv/**'
      - 'tools/audio/**'
      - 'schema/**'
      - 'CMakeLists.txt'
      - 'project/android/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_app:
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: "-Xmx4g"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Java 17 + Android SDK components (NDK / CMake) installed manually
      #    (android-actions/setup-android@v3 is avoided: it fails on the
      #     legacy "tools" package).
      # ------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # 3. Blindaje contra el error de firmado: create ~/.android and
      #    ~/.config/.android, generate the standard debug.keystore with
      #    keytool, copy it into .config and fix ownership.
      # ------------------------------------------------------------------
      - name: Prepare debug keystore (signing blindage)
        run: |
          sudo mkdir -p ~/.android ~/.config/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
          sudo chown -R $USER:$USER ~/.config/.android
          ls -l ~/.android ~/.config/.android

      # ------------------------------------------------------------------
      # Cache Gradle dependencies / wrappers to speed up rebuilds.
      # ------------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/Android/MnnLlmChat/**/*.gradle', 'apps/Android/MnnLlmChat/gradle/wrapper/gradle-wrapper.properties', 'apps/Android/MnnLlmChat/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ------------------------------------------------------------------
      # 4. Build the native MNN engine exactly like apps/Android/MnnLlmChat/build.sh
      #    All cmake flags are passed on a single line to avoid bash
      #    line-continuation interpretation problems.
      #    `make install` places libMNN.so in project/android/build_64/lib,
      #    the exact path the app's CMakeLists.txt expects.
      # ------------------------------------------------------------------
      - name: Build MNN native engine (arm64-v8a)
        run: |
          cd project/android
          mkdir -p build_64
          cd build_64
          ../build_64.sh -DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DLLM_SUPPORT_AUDIO=true -DMNN_BUILD_AUDIO=true -DMNN_BUILD_DIFFUSION=ON -DMNN_SEP_BUILD=OFF -DBUILD_PLUGIN=ON -DMNN_QNN=OFF -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384' -DCMAKE_INSTALL_PREFIX=.
          make install
          ls -la lib/
          test -f lib/libMNN.so || { echo "ERROR: libMNN.so not found after make install"; exit 1; }

      # ------------------------------------------------------------------
      # 5. Compile the APK with Gradle (standard flavor, debug build type).
      # ------------------------------------------------------------------
      - name: Assemble APK (assembleStandardDebug)
        working-directory: apps/Android/MnnLlmChat
        run: ./gradlew assembleStandardDebug --no-daemon --stacktrace

      # ------------------------------------------------------------------
      # 6. Upload the APK artifact.
      # ------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-llmchat-standard-debug-apk
          path: apps/Android/MnnLlmChat/app/build/outputs/apk/standard/**/*.apk
          if-no-files-found: error
