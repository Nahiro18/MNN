# Build the MNN Android LLM Chat app (APK) in GitHub Actions.
#
# Pipeline:
#   1. ubuntu-24.04 runner (Android SDK base preinstalled; no setup-android action).
#   2. JDK 17 (Temurin) + manual SDK component install (NDK 27.2.12479018, CMake 3.22.1).
#   3. Debug keystore "blindage" to avoid Gradle signing/permission failures.
#   4. Native MNN engine build (project/android/build_64 + make install -> libMNN.so).
#   5. Gradle assembleStandardDebug with GRADLE_OPTS=-Xmx4g.
#   6. Upload the resulting APK as an artifact.

name: android-app-build

on:
  push:
    branches:
      - master
      - 'feature/**'
    paths:
      - 'apps/Android/**'
      - 'source/**'
      - 'express/**'
      - 'include/**'
      - 'transformers/**'
      - 'tools/cv/**'
      - 'tools/audio/**'
      - 'schema/**'
      - 'CMakeLists.txt'
      - 'project/android/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    branches: [master]
    paths:
      - 'apps/Android/**'
      - 'source/**'
      - 'express/**'
      - 'include/**'
      - 'transformers/**'
      - 'tools/cv/**'
      - 'tools/audio/**'
      - 'schema/**'
      - 'CMakeLists.txt'
      - 'project/android/**'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_app:
    runs-on: ubuntu-24.04
    env:
      GRADLE_OPTS: "-Xmx4g"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------
      # Java 17 (Temurin).
      # NOTE: android-actions/setup-android@v3 is intentionally NOT used
      # (obsolete; fails on the legacy "tools" package).
      # ------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------------
      # Blindaje contra el error de firmado (Paso Crítico):
      #   1. Crear manualmente ~/.android y ~/.config/.android con sudo.
      #   2. Generar el debug.keystore estándar usando keytool.
      #   3. Copiar el keystore a la carpeta .config y corregir permisos.
      #
      # ORDERING: this step runs BEFORE any sdkmanager call, because
      # `sudo sdkmanager --licenses` creates ~/.android owned by ROOT,
      # which previously made keytool fail with:
      #   java.io.FileNotFoundException: /home/runner/.android/debug.keystore
      #   (Permiso denegado)
      # Fixes applied:
      #   * chown ~/.android to the runner user immediately after mkdir.
      #   * keytool generates into /tmp (can never hit dir permissions),
      #     then we copy the result into place.
      #   * rm -f removes any stale root-owned keystore first.
      # ------------------------------------------------------------------
      - name: Prepare debug keystore (signing blindage)
        run: |
          sudo mkdir -p ~/.android ~/.config/.android
          sudo chown -R "$USER":"$(id -gn)" ~/.android ~/.config/.android
          chmod 755 ~/.android ~/.config/.android
          rm -f ~/.android/debug.keystore ~/.config/.android/debug.keystore
          keytool -genkeypair -v \
            -keystore /tmp/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp /tmp/debug.keystore ~/.android/debug.keystore
          cp /tmp/debug.keystore ~/.config/.android/debug.keystore
          chmod 644 ~/.android/debug.keystore ~/.config/.android/debug.keystore
          ls -l ~/.android ~/.config/.android

      # ------------------------------------------------------------------
      # Manual SDK component install: licenses + ONLY NDK 27.2.12479018
      # and CMake 3.22.1, then export ANDROID_NDK / ANDROID_SDK_ROOT.
      # ------------------------------------------------------------------
      - name: Install Android NDK and CMake
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sudo sdkmanager --licenses > /dev/null || true
          sudo sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          # Re-assert ownership of ~/.android in case sdkmanager touched it.
          sudo chown -R "$USER":"$(id -gn)" ~/.android || true
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------------
      # Cache Gradle dependencies / wrappers to speed up rebuilds.
      # ------------------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/Android/MnnLlmChat/**/*.gradle', 'apps/Android/MnnLlmChat/gradle/wrapper/gradle-wrapper.properties', 'apps/Android/MnnLlmChat/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ------------------------------------------------------------------
      # Build the native MNN engine exactly like apps/Android/MnnLlmChat/build.sh
      # All cmake flags are passed on a SINGLE LINE to avoid bash
      # line-continuation interpretation problems.
      # `make install` places libMNN.so in project/android/build_64/lib,
      # the exact path the app's CMakeLists.txt expects.
      # ------------------------------------------------------------------
      - name: Build MNN native engine (arm64-v8a)
        run: |
          cd project/android
          mkdir -p build_64
          cd build_64
          ../build_64.sh -DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DLLM_SUPPORT_AUDIO=true -DMNN_BUILD_AUDIO=true -DMNN_BUILD_DIFFUSION=ON -DMNN_SEP_BUILD=OFF -DBUILD_PLUGIN=ON -DMNN_QNN=OFF -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384' -DCMAKE_INSTALL_PREFIX=.
          make install
          ls -la lib/
          test -f lib/libMNN.so || { echo "ERROR: libMNN.so not found after make install"; exit 1; }

      # ------------------------------------------------------------------
      # Compile the APK with Gradle (standard flavor, debug build type).
      # ------------------------------------------------------------------
      - name: Assemble APK (assembleStandardDebug)
        working-directory: apps/Android/MnnLlmChat
        run: ./gradlew assembleStandardDebug --no-daemon --stacktrace

      # ------------------------------------------------------------------
      # Upload the APK artifact.
      # ------------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnn-llmchat-standard-debug-apk
          path: apps/Android/MnnLlmChat/app/build/outputs/apk/standard/**/*.apk
          if-no-files-found: error
